  <script src="https://cdn.tailwindcss.com"></script>


  <script>

    tailwind.config = {

      theme: {

        extend: {

          colors: {

            pet: {
              orange: '#FFA56D',
              red: '#E00808',
              blue: '#0600A9',
              cream: '#FFEFE5',
              beige: '#E4B99E',
              yellow: '#EEEE82'
            }

          },

          fontFamily: {

            sans: [
              'Roboto',
              'sans-serif'
            ],

            serif: [
              'Abhaya Libre',
              'serif'
            ]

          },

          keyframes: {

            fadeIn: {

              '0%': {
                opacity: '0'
              },

              '100%': {
                opacity: '1'
              }

            },

            fadeInDown: {

              '0%': {
                opacity: '0',
                transform:
                  'translate(-50%, -10px)'
              },

              '100%': {
                opacity: '1',
                transform:
                  'translate(-50%, 0)'
              }

            },

            fadeInUp: {

              '0%': {
                opacity: '0',
                transform:
                  'translateY(15px)'
              },

              '100%': {
                opacity: '1',
                transform:
                  'translateY(0)'
              }

            },

            shake: {

              '0%, 100%': {
                transform:
                  'translateX(0)'
              },

              '20%, 60%': {
                transform:
                  'translateX(-6px)'
              },

              '40%, 80%': {
                transform:
                  'translateX(6px)'
              }

            }

          },

          animation: {

            fadeIn:
              'fadeIn .5s ease-out',

            fadeInDown:
              'fadeInDown .25s ease-out',

            fadeInUp:
              'fadeInUp .6s ease-out',

            shake:
              'shake .4s ease-in-out'

          }

        }

      }

    };

  </script>
