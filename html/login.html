<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Central Pet - Acesse sua conta.">

  <title>Central Pet - Login</title>



  <script src="https://cdn.tailwindcss.com"></script>


  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pet: {
              orange: '#FFA56D',
              red: '#E00808',
              blue: '#0600A9',
              cream: '#FFEFE5',
              beige: '#E4B99E',
              yellow: '#EEEE82'
            }
          },

          fontFamily: {
            sans: ['Roboto', 'sans-serif'],
            serif: ['Abhaya Libre', 'serif']
          },

          keyframes: {

            fadeIn: {
              '0%': {
                opacity: '0'
              },
              '100%': {
                opacity: '1'
              }
            },

            fadeInUp: {
              '0%': {
                opacity: '0',
                transform: 'translateY(15px)'
              },
              '100%': {
                opacity: '1',
                transform: 'translateY(0)'
              }
            }

          },

          animation: {

            fadeIn: 'fadeIn .5s ease-out',

            fadeInUp:
              'fadeInUp .6s ease-out'

          }
        }
      }
    };
  </script>


  <!-- =====================================================
         FONTES
    ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">

</head>


<body class="
        min-h-screen
        flex
        flex-col
        bg-pet-cream
        font-sans
        text-black
    ">


  

  <header class="
            w-full
            h-[70px]
            shrink-0
            bg-pet-orange
            px-5
            sm:px-[30px]
            flex
            items-center
        ">

    <div class="flex items-center">

      <a href="inicio.html" class="
                    flex
                    items-center
                    gap-2.5
                    transition-transform
                    duration-200
                    hover:scale-[1.02]
                ">

        <img src="../img/logo-centralpet.png" alt="Logo Central Pet" width="40" height="40" class="
                        w-10
                        h-10
                        object-contain
                        max-w-[40px]
                        max-h-[40px]
                    ">

        <span class="
                        font-serif
                        text-3xl
                        sm:text-[32px]
                        font-extrabold
                        text-black
                    ">
          Central
          <span class="text-pet-red">
            Pet
          </span>
        </span>

      </a>

    </div>

  </header>

  <main class="
            flex-1
            w-full
            flex
            items-center
            justify-center
            px-5
            py-10
            bg-pet-cream
            bg-[url('../img/fundo-patinhas.png')]
            bg-repeat
            bg-top
            bg-[length:320px]
        ">

    <section class="
                animate-fadeInUp
                relative
                z-10
                w-full
                max-w-[400px]
                rounded-lg
                border
                border-gray-200
                bg-white
                p-[30px]
                shadow-xl
                transition-all
                duration-300
                hover:shadow-2xl
            ">


      <h1 class="
                    mb-7
                    text-center
                    text-4xl
                    font-extrabold
                    leading-none
                    text-black
                    sm:text-[48px]
                ">
        Login
      </h1>


      <!-- Abertura do formulário (sem fechar imediatamente) -->
      <form action="../php/login.php" method="POST">

        <div class="mb-[17px]">
          <label for="user-email" class="mb-1.5 block text-xs font-medium text-[#333333]">
            E-mail:
          </label>
          <input type="email" id="user-email" name="email" autocomplete="email" placeholder="Insira seu e-mail" required
            class="h-10 w-full rounded-md border border-[#D8D8D8] bg-white px-3 text-sm text-black outline-none placeholder-[#999999] transition-all duration-200 focus:border-pet-blue focus:ring-2 focus:ring-pet-blue/10 hover:border-[#BDBDBD]">
        </div>

        <div class="mb-[15px]">
          <div class="mb-1.5 flex items-center justify-between">
            <label for="senha" class="block text-xs font-medium text-[#333333]">
              Senha:
            </label>
            <a href="esqueceuSenha.html" class="text-xs text-pet-blue transition-colors duration-200 hover:text-blue-800 hover:underline">
              Esqueceu a senha?
            </a>
          </div>
          <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Insira sua senha"
            required class="h-10 w-full rounded-md border border-[#D8D8D8] bg-white px-3 text-sm text-black outline-none placeholder-[#999999] transition-all duration-200 focus:border-pet-blue focus:ring-2 focus:ring-pet-blue/10 hover:border-[#BDBDBD]">
        </div>

        <div class="mt-3 flex items-center gap-2">
          <input type="checkbox" id="lembrar" name="lembrar" class="h-4 w-4 cursor-pointer accent-[#0600A9]">
          <label for="lembrar" class="cursor-pointer text-xs text-gray-600">
            Lembrar de mim
          </label>
        </div>

        <div class="mt-[25px] mb-4">
          <button type="submit" id="confirmarLogin" class="h-[42px] w-full cursor-pointer rounded-md border-2 border-pet-red bg-pet-red text-sm font-bold text-white shadow-lg shadow-red-500/30 transition-all duration-300 ease-in-out hover:-translate-y-1 hover:scale-[1.02] hover:bg-red-700 hover:shadow-red-500/40 active:translate-y-0 active:scale-[0.98]">
            Entrar
          </button>
        </div>

        <div class="mt-4 text-center">
          <p class="text-xs text-gray-600">
            Não tem uma conta?
            <a href="cadastro.html" class="font-medium text-pet-blue transition-colors duration-200 hover:text-blue-800 hover:underline">
              Cadastre-se
            </a>
          </p>
        </div>

      </form> <!-- O formulário fecha AQUI, depois de todos os elementos -->

      

    </section>

  </main>


  <footer class="
            flex
            min-h-[80px]
            w-full
            shrink-0
            items-center
            justify-center
            bg-pet-blue
            px-5
            text-center
            text-white
        ">

    <p class="text-sm">
      &copy; 2026 Central Pet. Todos os direitos reservados.
    </p>

  </footer>
  <script src="../js/login.js"></script>

</body>

</html>
