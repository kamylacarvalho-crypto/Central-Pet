
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - Central Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen bg-[#FFEFE5] flex items-center justify-center p-4">

    <main class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

        <h1 class="text-2xl font-bold text-center text-[#0600A9] mb-3">
            Nova senha
        </h1>

        <p class="text-center text-gray-600 mb-6">
            Cadastre uma nova senha para sua conta Central Pet.
        </p>

        <form id="formSenha" class="space-y-4">

            <input
                type="password"
                id="novaSenha"
                placeholder="Nova senha"
                minlength="6"
                required
                class="w-full border rounded-lg p-3"
            >

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Confirme a nova senha"
                minlength="6"
                required
                class="w-full border rounded-lg p-3"
            >

            <button
                type="submit"
                class="w-full bg-[#0600A9] text-white rounded-lg p-3 font-semibold"
            >
                Salvar nova senha
            </button>

        </form>

        <p id="mensagem" class="text-center mt-4 text-sm"></p>

    </main>

    <script src="../js/redefinir-senha.js"></script>

</body>
</html>
